<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ExitTogether explained</title>
  <style>
    :root{color-scheme:dark;--bg:#0b110e;--panel:#111b15;--line:rgba(255,255,255,.12);--ink:#f1f7f3;--muted:#91a096;--green:#67e7a0;--blue:#8395ff;--ease:cubic-bezier(.23,1,.32,1)}*{box-sizing:border-box}html,body{width:100%;overflow:hidden}body{margin:0;min-width:320px;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.demo{width:100%;min-height:100vh;padding:26px;display:grid;grid-template-rows:auto 1fr auto;gap:20px;background:radial-gradient(circle at 80% 10%,rgba(103,231,160,.08),transparent 34%),var(--bg)}header{display:flex;justify-content:space-between;align-items:start;gap:18px}.kicker{color:var(--green);font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}h1{margin:8px 0 0;font-size:25px;line-height:1.05;letter-spacing:-.05em}.stage-count{color:var(--muted);font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace}.stage{position:relative;min-height:238px;display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:16px}.orders{display:grid;grid-template-columns:1fr 1fr;gap:8px}.order{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);opacity:1;transform:none;transition:transform 420ms var(--ease),opacity 260ms ease}.order span,.batch span,.quote span{display:block;color:var(--muted);font:500 7px ui-monospace,SFMono-Regular,Menlo,monospace}.order strong{display:block;margin-top:4px;font-size:13px}.core{width:90px;height:90px;position:relative;z-index:2;display:grid;place-items:center;align-content:center;gap:6px;border:1px solid rgba(103,231,160,.3);border-radius:25px;background:#101a14;box-shadow:0 0 0 8px rgba(103,231,160,.05)}.core b{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--green);color:#0b110e;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace}.core small{color:var(--green);font:600 6px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}.result{position:relative;display:grid;gap:9px}.batch,.quote{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);opacity:.35;transform:translateX(12px);transition:transform 420ms var(--ease),opacity 260ms ease,border-color 200ms ease}.batch strong,.quote strong{display:block;margin-top:5px;font-size:18px}.quote strong{color:var(--green)}.route{position:absolute;left:calc(50% - 86px);right:calc(50% - 86px);top:50%;height:1px;background:var(--line)}.route i{position:absolute;top:-3px;left:0;width:7px;height:7px;border-radius:50%;background:var(--green);opacity:0}.caption{min-height:34px;margin:0;color:var(--muted);font-size:10px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px}.controls button{min-width:130px;padding:11px 14px;border:0;border-radius:10px;background:var(--green);color:#0b110e;font-weight:800;font-size:9px;cursor:pointer;transition:transform 150ms var(--ease)}.controls button:active{transform:scale(.97)}.legend{color:#738078;font:500 7px ui-monospace,SFMono-Regular,Menlo,monospace}.demo[data-phase="1"] .order{opacity:.35;transform:translateX(72px) scale(.96)}.demo[data-phase="1"] .order:nth-child(2){transition-delay:70ms}.demo[data-phase="1"] .order:nth-child(3){transition-delay:140ms}.demo[data-phase="1"] .order:nth-child(4){transition-delay:210ms}.demo[data-phase="2"] .order,.demo[data-phase="3"] .order{opacity:0;transform:translateX(96px) scale(.96)}.demo[data-phase="2"] .batch,.demo[data-phase="3"] .batch{opacity:1;transform:none;border-color:rgba(103,231,160,.3)}.demo[data-phase="2"] .route i{opacity:1;animation:travel 1s linear forwards}.demo[data-phase="3"] .batch,.demo[data-phase="3"] .quote{opacity:1;transform:none}.demo[data-phase="3"] .quote{border-color:rgba(103,231,160,.35)}@keyframes travel{to{left:calc(100% - 7px)}}
    @media(max-width:520px){.demo{min-height:520px;padding:20px}.stage{grid-template-columns:1fr;gap:12px}.orders{width:100%}.core{width:76px;height:76px;margin:auto;border-radius:21px}.result{grid-template-columns:1fr 1fr}.route{display:none}.controls{align-items:stretch;flex-direction:column-reverse}.controls button{width:100%}h1{font-size:22px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.order{transform:none!important}.demo[data-phase="1"] .order,.demo[data-phase="2"] .order,.demo[data-phase="3"] .order{opacity:.18}.batch,.quote{transform:none!important}}
  </style>
</head>
<body>
  <main class="demo" data-phase="0">
    <header><div><span class="kicker">How ExitTogether works</span><h1>Small orders become<br />one larger exit.</h1></div><span class="stage-count" aria-live="polite">01 / 04</span></header>
    <section class="stage" aria-label="ExitTogether order flow">
      <div class="orders"><div class="order"><span>HOLDER 01</span><strong>$900</strong></div><div class="order"><span>HOLDER 02</span><strong>$1,350</strong></div><div class="order"><span>HOLDER 03</span><strong>$1,100</strong></div><div class="order"><span>YOUR ORDER</span><strong>$1,650</strong></div></div>
      <div class="route"><i></i></div><div class="core"><b>T</b><small>EXIT<br />TOGETHER</small></div>
      <div class="result"><div class="batch"><span>COMPATIBLE BATCH</span><strong>$5,000</strong></div><div class="quote"><span>PROJECTED VALUE KEPT</span><strong>+$82.50</strong></div></div>
    </section>
    <div><p class="caption" aria-live="polite">Four holders want to sell the exact same RWA product.</p><div class="controls"><span class="legend">Illustrative numbers · no order placed</span><button type="button">Build the batch →</button></div></div>
  </main>
  <script>
    const demo=document.querySelector('.demo');const button=document.querySelector('button');const count=document.querySelector('.stage-count');const caption=document.querySelector('.caption');let timers=[];const copy=["Four holders want to sell the exact same RWA product.","TrueGuard checks product, direction, deadline and each holder’s slippage limit.","The compatible orders are grouped into one $5,000 sell request.","The batch is used only if the final quote leaves every holder better off after fees."];function setPhase(phase){demo.dataset.phase=String(phase);count.textContent=`0${phase+1} / 04`;caption.textContent=copy[phase];button.textContent=phase===3?'Replay':'Building…';button.disabled=phase>0&&phase<3}function run(){timers.forEach(clearTimeout);timers=[];setPhase(0);button.disabled=true;timers.push(setTimeout(()=>setPhase(1),500),setTimeout(()=>setPhase(2),1800),setTimeout(()=>{setPhase(3);button.disabled=false},3100))}button.addEventListener('click',()=>demo.dataset.phase==='3'?run():run());
  </script>
</body>
</html>
